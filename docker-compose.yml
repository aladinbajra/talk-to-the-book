version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./talk_to_the_book.db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - STORAGE_PATH=./storage
      - FAISS_INDEX_PATH=./storage/indices
      - DEBUG=true
    volumes:
      - ./storage:/app/storage
      - ./master_ingest_prompt.txt:/app/master_ingest_prompt.txt
      - ./logs:/app/logs
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

